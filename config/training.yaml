# training.yaml, the scoring half's settings. Loadable without the generator.
#
# Provenance note. Unlike the generator half, the training half has no provenance
# register anywhere in the project. Every value below is recorded only in v1 code
# or in docs/v1/T9Sim_Config_Reference.md, so all of them are route `inferred`
# with a v1 citation. Adopted 15 Aug 2026 on Ken's instruction. None has an
# outside source and none ever did.

hist_winning_price:
  # The switch that makes SSP price knowledge visible. Turning it off collapses
  # C3 to C1 on the price channel, so it is not a neutral default.
  enabled:
    value: true
    route: inferred
    source: "v1's code default is False, but every reported run overrode it: the v10 and v11 10M workers call run_profile(..., hist_clearing=True). docs/v1/v10_Training_Results.md:11 and docs/v1/T9Sim_Config_Reference.md:130,1270. v2 sets it explicitly rather than inherit a default no run used"

encoders:
  # ONE shrinkage constant, shared by both encoders. Open item O13, Ken's decision
  # 15 August 2026. An earlier v2 draft split it into encoders.dsp.shrink and
  # encoders.ssp.shrink; that split is REVERSED and must not be reintroduced.
  #
  # Why one. Empirical-Bayes shrinkage already adapts to sample size on its own:
  #   EB mean = (cell_sum + k*parent) / (cell_count + k)
  # so a cell with more observations is automatically shrunk less. The SSP encoder
  # sees more rows than the DSP encoder, but `cell_count` already handles that, so
  # the difference in data volume is no reason for a second k.
  #
  # Why not two. Two independently settable constants put a free knob exactly where
  # the C3 minus C1 result lives. Moving ssp.shrink alone could manufacture or erase
  # the SSP contrast and nothing in the design would object. One constant removes
  # that degree of freedom.
  #
  # The encoders DO differ, but in what each averages, not in how hard each is shrunk:
  #   dsp = won-rows-only mean of bid_price, served to all 4 views, winner's-curse biased
  #   ssp = all-clears mean of winning_price, won + sold-lost, C3 and C4 only, unbiased
  # That difference is the whole C3 minus C1 mechanism and it needs no second dial.
  shrink:
    value: 20.0
    route: inferred
    source: "v1 HCP_EB_K, t9_sim/src/t9sim/pipeline.py:82, one constant consumed by both encoders at :124 and :140"
    shared_by: [dsp, ssp]
    # v1 exposed this as the leak-versus-debias diagnostic, sweepable through the
    # environment variable T9_HCP_EB_K, to test whether the C3 minus C1 gain is real
    # de-biasing or cell memorisation. A single shared dial is all that diagnostic
    # needs, so collapsing the 2 slots costs it nothing.
    diagnostic_sweep: "vary this one value; low k lets sparse cells memorise, high k collapses the signal"
  dsp:
    note: "fitted on won-row own bids, served to all 4 views. Uses encoders.shrink"
  ssp:
    note: "fitted on winning price incl. lost-sold rows, C3 and C4 only. Uses encoders.shrink"
  keys: {value: [app_id, slot_format, ad_exchange, _daypart], route: inferred, source: "v1 HCP_KEYS, pipeline.py:83; backoff parent drops app_id"}

spend_model:
  # OPEN ITEM O12, CLOSED 16 August 2026 at stage 4, where the specification said to
  # close it. KEEP THE KEY AND FIT IT. It is no longer a hole and no longer a
  # setting: it is a fitted quantity, and this block records the method rather than
  # a number.
  #
  # The question O12 asked was prior to the value: does the parameter exist at all?
  # It does, and the PLAN forces that answer rather than any preference. The plan
  # scores spend CRPS. CRPS is a distributional score, so it needs a predictive
  # DISTRIBUTION, and a plain regression returns a point. v1 never faced this
  # because v1 reported rmse_spend, a point metric, and never reported spend CRPS.
  #
  # So head 4 is distributional: XGBoost predicts the LOCATION on the log-spend
  # scale, and the scale is the residual standard deviation of log spend, estimated
  # ON THE VALIDATION SPLIT so it is not fitted to the rows that trained the mean.
  # Written to the run's artifact per view, never hand-set, because a hardcoded
  # scale is exactly what went wrong with v1's AFT_SCALE.
  #
  # v1's AFT_SCALE = 1.0 remains a DIFFERENT quantity and must not be copied here:
  # it is the sigma of the EVALUATOR's win curve at pipeline.py:747, which builds
  # the "TRUE win curve" as norm.cdf((log b - log u) / AFT_SCALE) and thereby sets
  # the oracle ceiling every one of C1-C4 is scored against.
  distribution:
    value: lognormal
    route: inferred
    source: "O12, decided at stage 4. The generator draws G2 as LogNormal(mu_cat, sigma^ltv) x LU5 x LC2 x plat, so a lognormal predictive is the family the data is actually from. That makes the log-scale residual the natural scale parameter and gives CRPS a closed form"
  scale:
    fitted: true
    estimator: "standard deviation of (log spend - predicted log spend) on the validation split"
    route: inferred
    source: "O12, closed 16 Aug 2026. NOT a configured value. The fitted number is reported per view in the run artifact, and differs by view because each view trains on a different set of payers"

candidate_prices:
  # The bid ladder the profit-max bidder searches, shared by both learned bidders
  # and the true-value oracle.
  #
  # WIDENED 22 Aug 2026, rebuild plan v2.2 bid-ladder section. Values are USD per
  # IMPRESSION and `bidders.ladder` multiplies by PER_MILLE, so this is
  # geomspace(0.1, 1200, 60) in CPM.
  #
  # v1's 0.1-120 clipped the argmax: measured on the oracle at 100K seed 20250,
  # 1.528 percent of achievable profit sat on the top rung, against a pass
  # condition of 0.1 percent at each end. Our own bids top out near 26 CPM, which
  # is why the old ceiling looked generous, but m^win reaches 971 and ev reaches
  # 16,148 CPM on whale traffic.
  #
  # THE FLOOR STAYS AT 0.1. Raising it to 0.3 was proposed on the ground that
  # nothing clears below there, true by row count and false by money: it strands
  # 0.571 percent of profit on the bottom rung against 0.039 percent at 0.1.
  #
  # 60 rather than 96: doubling the rungs recovers about 0.2 points, because the
  # profit curve is flat at its own maximum, so grid error is second-order in
  # profit while a clipped ceiling is first-order. Verify with
  # tools/ladder_boundary.py, which is the pass condition rather than these
  # numbers being it.
  spacing: geomspace
  low:    {value: 0.0001, route: inferred, source: "v1 BID_GRID = np.geomspace(1e-4, 0.12, 48), t9_sim/src/t9sim/pipeline.py:73. The floor is v1's and is kept: at 0.1 CPM only 0.039 percent of oracle profit sits on the bottom rung"}
  high:   {value: 1.2,    route: inferred, source: "rebuild plan v2.2, bid-ladder section, 22 Aug 2026. Was 0.12, which put 1.528 percent of oracle profit on the top rung at 100K seed 20250; at 1.2 it is 0.000 percent"}
  n:      {value: 60,     route: inferred, source: "rebuild plan v2.2. Was 48. Twelve more rungs hold the step near v1's over a range ten times as wide, 17.3 percent against 16.3"}

roas_target:
  # The minimum return on ad spend a row must promise before the bidder will bid
  # on it at all: `ev / b >= target` at the rung the argmax has already picked.
  #
  # A GATE, NOT A CONSTRAINED SEARCH. The bidder takes its ordinary
  # profit-maximising bid and the row is then either bid or dropped. It never
  # reprices a row to meet the target, because a repriced bid would make the
  # ladder argmax mean one thing in a gated run and another in an ungated one,
  # and the two could no longer be compared. Rebuild plan v2.2, step 2.
  #
  # THE VALUE WAS 1.0 UNTIL 25 AUGUST 2026, AND AT 1.0 THE GATE NEVER FIRED.
  # Measured across ten seeds at 10M, the learned bidder placed on 99.99 percent
  # of test rows in C1 and 100.00 percent in C3. Every economic figure v2.2
  # reported before this date therefore described a bidder that bid on every
  # auction it saw.
  #
  # The reason is the exact zeros, and it was already written down here under
  # the old value. Thirty percent of rows have `ev_truth` of exactly zero, the
  # inactive archetype, so a target of 1 declines them and `truth_ev` and
  # `oracle` place only 0.2620 of rows. The learned head cannot produce an exact
  # zero. Its smallest prediction is 4.83 eCPM against a bottom rung of 0.1 CPM,
  # so nothing it values ever fails a test of `ev / b >= 1`. The gate was inert
  # on the one bidder the study reports.
  #
  # 3.0 IS SOURCEABLE RATHER THAN PICKED. The standard rule is that break-even
  # ROAS is one divided by the profit margin, so a threefold return is the
  # requirement of a buyer working to roughly a 33 percent margin. No advertiser
  # runs with no return requirement at all, so 1.0 described a policy that does
  # not exist in the market. This is a correction to a defective default and not
  # a search for a better number. Ken's ruling, 24 August 2026: "ROAS = 1
  # resulted the bidder bidding on ALL auctions, which is absolutely not how
  # advertisers behave. So change ROAS is fixing a bug."
  #
  # Note that the realised return runs well above the target, about 5.4 to 5.6
  # times across the views, because the gate tests expected value at the chosen
  # bid while a win also needs that bid to clear.
  #
  # CHANGING THIS INVALIDATES NO DATASET. training.yaml is excluded from the
  # design fingerprint by design, generate.py:53-56, because it changes how a
  # dataset is scored and never what it contains. The thirty parquets stay
  # valid and no regeneration is needed.
  value:
    value: 3.0
    route: inferred
    source: "Ken 24 Aug 2026, a correction rather than a tuning choice. At the previous value of 1.0 the learned bidder placed on 99.99 percent of rows, so the gate was inert. Break-even ROAS is 1 divided by the profit margin, making 3:1 the requirement of a buyer at roughly a 33 percent margin. Background in t9v2/docs/ROAS_Change_Background.md"

xgboost:
  # THREE parameter sets, not two. The Tier-2 win classifier is deeper than Tier-1.
  tier1_binary:
    value: {n_estimators: 300, max_depth: 6, learning_rate: 0.1, tree_method: hist,
            enable_categorical: true, eval_metric: logloss, early_stopping_rounds: 20}
    route: inferred
    source: "v1 XGB_CLF, t9_sim/src/t9sim/pipeline.py:66. The 3 binary heads P(click), P(install|click), P(payer|install)"
  tier1_spend:
    value: {n_estimators: 300, max_depth: 6, learning_rate: 0.1, tree_method: hist,
            enable_categorical: true, eval_metric: rmse, early_stopping_rounds: 20}
    route: inferred
    source: "v1 XGB_REG, t9_sim/src/t9sim/pipeline.py:69. The E[spend|payer] head"
  tier2_win_classifier:
    # monotone_constraints added 15 Aug 2026, open item O8, Ken's decision.
    # +1 on bid_price forces the fitted p(win | bid) to be non-decreasing in the bid,
    # which is a fact about the auction rather than a modelling preference: you win by
    # outbidding the field, so bidding more can never win less often. Without it a tree
    # will happily fit a sag wherever the training data is thin, and the bidder
    # maximises (ev - b) x p(win | b), so a sag at the peak moves the chosen bid.
    # See Schema diagrams/O8_monotone_win_curve.svg for the mechanism.
    # Keyed by feature NAME, not position, so the constraint cannot silently attach to
    # the wrong column if the Tier-2 feature list changes at stage 4.
    value:
      objective: "binary:logistic"
      eval_metric: auc
      tree_method: hist
      max_depth: 8
      monotone_constraints: {bid_price: 1}
    route: inferred
    source: "v1, t9_sim/src/t9sim/pipeline.py:621, deliberately deeper than Tier-1. The monotone constraint is NOT from v1, which had none; it is open item O8, decided 15 Aug 2026, and it makes the submitted paper's description of a monotone win classifier true"
    # NOT constrained, and deliberately left open. floor_price is the other feature the
    # win probability arguably moves monotonically in, downward, since a higher reserve
    # is harder to clear at a fixed bid. Ken decided the bid constraint only, so -1 on
    # floor_price stays a separate decision rather than being folded in here.
    # Cost to note at stage 4: a monotone constraint removes the model's freedom to fit
    # noise in that direction, so a small drop in raw win AUC is expected and is not a
    # regression. What matters is whether the bidder's chosen bid improves.
  # tier2_aft is DELETED, Ken's decision 15 August 2026. Tier 2 has ONE head.
  #
  # v1 ran two: an AFT survival model of the competing bid, and this classifier. v2
  # keeps only the classifier, because it makes no assumption about the shape of the
  # price distribution, and in v1 that was the difference between a true answer and a
  # false one: the AFT bidder showed an SSP overpayment reduction that the classifier
  # showed to be about zero, and the classifier was right.
  #
  # What is given up, stated plainly rather than discovered later:
  #   price_rmse_all, price_rmse_lost, price_crps_all, price_crps_lost. All 4 need a
  #   predicted PRICE, and a classifier has none. The lost-row slice is the real loss,
  #   since scoring a price on rows whose price was never observed is the most direct
  #   measurement of the censoring story. v2 measures SSP value through win AUC and
  #   profit instead, which is narrower but sound.
  # What is NOT given up: ece_win and mce_win. Those are calibration measures on a win
  #   probability, the classifier has one, and v1 simply never computed them for it.
  #   They are now required below.
  # Why this costs v2 nothing it had planned for: overpay is already not a v2 metric,
  #   so the AFT-versus-classifier comparison had no v2 consumer, and the plan's 7
  #   scored figures never included a price metric.
  #
  # Do not re-add an AFT head without also deciding the sigma question v1 left open:
  # its single sigma trained the model, shaped its win curve, scored its CRPS AND built
  # the oracle ceiling every view was judged against.
  #
  # RE-ADDED 23 August 2026 as `tier2_price` below, and the sigma question is
  # answered rather than inherited. See that block.
  tier2_price:
    # THE PRICE HEAD. One estimand for all four views, m^win, the minimum winning
    # price. What differs between views is not what is predicted but how well it
    # is OBSERVED, which is the ablation working rather than a methodological
    # difference smuggled in beside it.
    #
    #   C3, C4        exact on every row, from `min_winning_price`
    #   C1, C2 won    floor <= m^win <= bid, a bounded interval
    #   C1, C2 lost   m^win >= max(bid, floor), right-unbounded
    #
    # ONE LIKELIHOOD, NOT TWO. All four views use the same interval-censored
    # class; C3 and C4 simply supply degenerate intervals [x, x]. With plain
    # regression on one side and a censored model on the other, C3 minus C1 would
    # mix the data layer with the estimator and no reader could tell which
    # produced the contrast.
    #
    # `aft_loss_distribution_scale` IS NOT SET HERE, and its absence is the
    # point. v1 copied 1.0 from nowhere and that constant sat on the headline
    # contrast. It is now read off C3's residuals per seed at its own scale,
    # clamped to [0.2, 2.0], and recorded in results.json. See `train/price.py`.
    value: {n_estimators: 300, max_depth: 6, learning_rate: 0.1, tree_method: hist,
            enable_categorical: true, objective: "survival:aft",
            eval_metric: "aft-nloglik",
            aft_loss_distribution: normal, early_stopping_rounds: 20}
    route: inferred
    source: "rebuild plan v2.2 step 6, 22 Aug 2026. Tree parameters follow tier1_binary, which is v1's XGB_CLF; the objective and the censoring are the plan's, and the scale is deliberately absent"

  sigma:
    # The AFT scale, and the one number v1 never justified.
    #
    # It is INERT where labels are exact and LOAD-BEARING where they are not. For
    # a normal AFT with all-exact observations the location MLE does not depend on
    # the scale, so sigma does nothing to C3 and C4. For interval observations the
    # likelihood is a difference of two normal CDFs whose shape sigma sets, so it
    # does affect C1 and C2 -- which are interval on every row. Sigma therefore
    # still sits on the C3 minus C1 contrast, THROUGH C1. It halves the problem
    # rather than dissolving it.
    #
    # So it is estimated, not chosen: sigma_hat = std(log m^win - log pred) on
    # C3's held-out rows. Nearly free, because the same fact that makes it inert
    # in C3 means C3 can be fitted with any placeholder and the residual spread
    # read off afterwards. The whole cost is one ordering rule -- C3 trains first
    # -- and one line of arithmetic.
    #
    # ESTIMATED WITHIN EACH RUN AT ITS OWN SCALE. Residual spread shrinks as the
    # model improves with data, so a value taken from a 1M pilot is too wide for a
    # 10M campaign.
    #
    # THE COST, stated because a reader should be told rather than left to find
    # it: C1's sigma is derived from C3's labels, so a view defined by NOT having
    # SSP data borrows one quantity computed from it. What transfers is a nuisance
    # parameter and not price information -- a scale, nothing about where prices
    # sit -- and it is the only option of the three weighed that leaves the
    # contrast free of a fitted parameter. It belongs in the limitations.
    placeholder:
      value: 1.0
      route: inferred
      source: "v1 AFT_SCALE. Used for C3 and C4, where the normal-AFT location MLE is independent of the scale, so it barely affects the FIT: measured, C3 rmse_log moves 0.0076 across sigma 0.2 to 4.0. It is NOT inert downstream. runner.py passes this same value to the win curve, the curve sets the argmax bid, and C3 wins about 15 percent more auctions at 0.75 than at 1.5 -- so C3 and C4 bid at 1.0 while C1 and C2 bid at the fitted ~0.90, and plan section 7b says all four should use one value. Queued as Q4, corrected here 23 Aug 2026 because this field previously read 'it cannot affect a number'. Never used for C1 or C2"
    clamp_low:
      value: 0.2
      route: inferred
      source: "rebuild plan v2.2 step 6. A guard so a pathological seed cannot produce nonsense, not a tuning range"
    clamp_high:
      value: 2.0
      route: inferred
      source: "rebuild plan v2.2 step 6, as clamp_low"

split_days: {train: [1, 20], valid: [21, 24], test: [25, 28]}

# Calibration, MEASURED and never fitted, per open item O7. v1 reported ece and mce
# for its AFT head only and gave the classifier logloss instead, so the 2 Tier-2 heads
# were never scored on a common footing. With one head that asymmetry is gone, and
# Ken's decision of 15 August adds both measures to it.
calibration:
  measures: [ece, mce]
  heads: [click, install, payer, win]
  bins:
    value: 10
    route: inferred
    source: "not stated in any document. 10 equal-width bins is the common default for expected calibration error and matches how v1's reported figures read"
  note: >
    ece is the average gap between predicted probability and observed frequency across
    bins, so it says how wrong calibration is on average. mce is the largest single-bin
    gap, so it says how wrong it gets at its worst. A head can have a small ece and a
    bad mce if one region is badly off, which is why both are reported. Neither is
    gated: they are reported per head per view, and O7 records why v2 fits no
    calibrator.

attribution:
  # CONFLICT carried over from v1, declared rather than hidden. Two live SHAP paths
  # disagree: t9_sim/src/t9sim/pipeline.py:774 samples 3000, while
  # t9_sim/scripts/v10_shap.py:82 samples 4000. Both use seed 0. v2 takes 4000
  # because that is the path docs/SHAP_Analysis_v10.md reports.
  samples: {value: 4000, route: inferred, source: "t9_sim/scripts/v10_shap.py:82, the path behind the reported v10 SHAP figures. v1's pipeline default was 3000; see docs/T9Sim_Hole_Provenance.md finding F"}
  seed:    {value: 0, route: inferred, source: "t9_sim/scripts/v10_shap.py:82 and docs/v1/T9Sim_Config_Reference.md:961, random_state=0 on both paths"}
  top_k:   {value: 8, route: inferred, source: "docs/v1/T9Sim_Config_Reference.md:961, top 8 features by mean absolute SHAP"}
