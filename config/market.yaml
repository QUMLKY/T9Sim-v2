# market.yaml, the generator half's settings.
# Every value carries {value, route, source}. route is one of quoted,
# auto-calibrated, inferred, specified. A value the documents do not supply is
# left as HOLE and reported by the conformance check at gate 1.

auction:
  # rho is NOT here. Open item O3 3d gave it one home, profiles.yaml, because it
  # is a run setting rather than a design constant. Do not re-add it, the
  # duplicate-key check will fail on two homes.
  shade:
    value: 0.85
    route: specified
    source: "docs/Simulator_Schema - June 10 (v7).md:245 gives the design range, H2 = value_estimate x shade(~0.7-1.0) x LogNormal(0, sigma_explore). 0.85 is its midpoint. No outside source stands behind the range"
  # The win-rate pin, added 16 August 2026 for the same reason as ltv.lognormal_mu:
  # it is in the calibrated.yaml contract and had no starting value anywhere, so
  # the bisection had no origin. 1 is the neutral start v1 declared
  # (benchmarks.yaml:249) and it means "bid the value estimate unshaded by any
  # global factor", so a solved value above 1 reads directly as how far the market
  # has to be leaned on to reach a 30 percent win rate. v1 never persisted its
  # answer: the bisection ran on a warm-up sample at generation time and the
  # result was not written to calibrated.yaml, so there is no v1_solved to record.
  k_global:
    value: 1.0
    route: auto-calibrated
    target:
      quantity: "win rate"
      band: [0.295, 0.305]
      source: "market.yaml win_rate.target 0.30 with win_rate.solver_tolerance 0.005"
    source: "neutral start 1, v1 benchmarks.yaml:249 'solved on warm-up so win rate hits profiles.win_rate.target'. Route and method at t9_sim/calibration/provenance_table.md:36, bisection on a warm-up sample"
  sigma_explore:
    value: 0.30
    route: inferred
    source: "t9_sim/calibration/provenance_table.md:35, 'bid diversity for Tier-2 P(win|bid)'. No non-v1 statement of a value exists. NB this is a sigma on the log-bid scale and the evaluator's win curve uses 1.0 for the same quantity, see docs/T9Sim_Hole_Provenance.md finding E"

entity_latents:
