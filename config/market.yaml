# Median per-format eCPM targets, US 2025. These scale the iPinYou price shapes,
# and slot_format alone explains about half the variance of the rival bid, so
# they are the single largest term in the market layer.
ecpm_targets_usd:
  banner:
    value: 1.00
    route: quoted
    source: "docs/Industry_Source_Reports.md:111, section 7 Tenjin with Clever Ads Solutions: 'Tier 1 (US/UK): banner $0.50-1.50'. Midpoint"
  interstitial:
    value: 6.50
    route: quoted
    source: "docs/Industry_Source_Reports.md:111, section 7 Tenjin: 'interstitial $5-8'. Midpoint"
  rewarded:
    value: 18.00
    route: quoted
    source: "docs/Industry_Source_Reports.md:169, section 12 Appodeal: 'Rewarded video eCPM US Android $18.36'. Tenjin's own band at :111 is $15-30; the Appodeal point is taken in preference to its midpoint"

advertiser_scale:
  # Two different shares, and confusing them is a known silent defect. Appendix A
  # of the specification records it: advertiser_share sets POOL COMPOSITION, how
  # many advertisers sit in each tier, while campaign_share allocates CAMPAIGN
  # VOLUME, how many rows each tier wins. Building row frequency from the published
  # advertiser_share puts majors on the wrong share of rows, and win-rate
  # autocalibration then absorbs the level shift so no validation gate fires.
  # Both were missing from v2 until 16 August 2026, which left `adv_tier` and
  # `sample_weight` naming keys that existed only in v1.
  advertiser_share:
    indie: {value: 0.85, route: quoted, source: "count-mix proxy: SocialPeta 84K+/month advertisers against Sensor Tower revenue-tier counts, empirically about 0.87/0.11/0.02. t9_sim/config/benchmarks.yaml:145"}
    mid:   {value: 0.13, route: quoted, source: "count-mix proxy, Sensor Tower 828 games above $10M as the mid cohort. benchmarks.yaml:149"}
    major: {value: 0.02, route: quoted, source: "count-mix proxy, top-1 percent publisher cohort, 134 games above $100M. benchmarks.yaml:153"}
  campaign_share:
    indie: {value: 0.05, route: inferred, source: "spend-share proxy from IAP concentration, top 1 percent at 92.5 percent (Sensor Tower 2025), discounted for ad-monetised indie spend. benchmarks.yaml:146. docs/T9Sim_Specification_v2.md Appendix A row C2 fixes this vector at 0.05/0.20/0.75"}
    mid:   {value: 0.20, route: inferred, source: "spend-share proxy, see indie. benchmarks.yaml:150"}
    major: {value: 0.75, route: inferred, source: "spend-share proxy from IAP concentration, discounted; the stated range is 0.70-0.85. benchmarks.yaml:154"}
  # Per-tier bid-level multiplier on the value estimate in H2.
  k_cpa:
    indie:
      value: 0.8
      route: inferred
      source: "t9_sim/calibration/provenance_table.md:21, 'thinner margins -> lower bid level'. The same row states outright that NO PUBLISHED bid-level-by-size data exists, so this stays inferred permanently"
    mid:
      value: 1.0
      route: inferred
      source: "as indie. The reference tier, 1.0 by construction"
    major:
      value: 1.2
      route: inferred
      source: "as indie"
app_categories:
