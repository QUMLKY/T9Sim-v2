  # residuals until 16 August 2026. Restored from t9_sim/config/benchmarks.yaml
  # :119-130, whose figures were re-checked against docs/Industry_Source_Reports.md
  # section 21, an adversarial verification pass run on these exact values on
  # 10-11 June 2026. All 3 stay `inferred`: every underlying figure is a CREATIVE
  # share and the quantity wanted is a SPEND share, so the step between them is
  # judgement no source makes.
  strategy:
    value: 0.17
    route: inferred
    source: "externally bounded. SocialPeta FY2025 SLG creative share 6.7 percent, upweighted on per-title intensity, 728 creatives per title per year, and on AppsFlyer's US iOS midcore budgets +43 percent YoY. The split against rpg is inferred. Industry_Source_Reports.md:275,277"
