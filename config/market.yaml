    route: inferred
    source: "externally bounded. AppsFlyer 2026, casual is about 50 percent of $25B global UA spend, is the quoted anchor; the +0.05 US and folding adjustment is inferred, cross-checked against SocialPeta FY2025 creative share of about 58 percent for casual plus casino plus puzzle"
