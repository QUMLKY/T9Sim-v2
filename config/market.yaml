ltv:
  # The solver's starting point, added 16 August 2026. Every other constant in
  # the calibrated.yaml contract had a value here to begin the search from and
  # this one had none, so the search had no origin. It is the ANALYTIC value,
  # mu = ln(median) = ln(6), which is what v1 declared before its own autocal ran
  # (benchmarks.yaml:72-75, route `quoted`). v1's ANSWER was 0.481154, recorded
  # below as a check on the stage-2 solve and never read by the loader: the
  # solved value belongs in calibrated.yaml, written by the solver, or the two
  # would be indistinguishable.
  lognormal_mu:
    value: 1.7918
    route: auto-calibrated
    target:
      quantity: "median payer spend, USD"
      band: [6.0, 6.0]
      source: "market.yaml ltv.base_median_usd. NB the circularity warning below: validation.yaml scores the simulator against the same 6.00 this solve aims at"
    v1_solved: 0.481154
    source: "analytic start ln(6) = 1.7918, v1 benchmarks.yaml:72-75. v1's solved answer 0.481154 at t9_sim/calibration/provenance_table.md:11, SOLVED by autocal 2026-06-18; it is a sanity check on v2's solve, not an input"
  # RELABELLED `specified` to `auto-calibrated` on 16 August 2026. 1.648169 is not
  # a design number: v1's provenance table records it as SOLVED by autocal on
  # 18 June 2026 against the whale top-5-percent revenue-share target 0.55-0.65
  # (t9_sim/calibration/provenance_table.md:12). Routing it `specified` claimed a
  # design document stood behind a fitted value. The solver rewrites this at
  # stage 2, so the number below is v1's answer kept as the starting point and as
  # a sanity check, never as the authority.
  lognormal_sigma:
    value: 1.648169
    route: auto-calibrated
    target:
      quantity: "the whale top-5-percent share of total generated revenue"
      band: [0.55, 0.65]
      source: "docs/Industry_Source_Reports.md, the whale-concentration band. The provenance of an auto-calibrated value is this target, not the number"
    source: "t9_sim/calibration/provenance_table.md:12, SOLVED by autocal 2026-06-18. v1's analytic starting point was sqrt(2 x ln(mean/median)) = sqrt(2 x ln(25/6)) = 1.6889, routed `quoted` at benchmarks.yaml:76-79 with the note 'then refined vs whale target (autocal)'. The refinement is what 1.648169 is"
  # RELABELLED from `quoted` to `inferred` on 15 Aug 2026. The v1 record cites
  # "GameAnalytics / Wappier ARPPU", but docs/Industry_Source_Reports.md carries no
  # such figure for either firm: its GameAnalytics section has retention only, and
  # Wappier appears once as a bare URL with no number. The companion mean of $25
  # cites Unity and AppMagic, whose sections give whale concentration and $7/$15
  # transaction sizes respectively. Nothing supports $6 or $25.
  # CIRCULARITY WARNING: lognormal_mu is SOLVED against this number, and
  # validation.yaml then scores the simulator against the same number.
  base_median_usd:
    value: 6.0
    route: inferred
    source: "v1 claimed quoted to GameAnalytics / Wappier ARPPU; unsupported by docs/Industry_Source_Reports.md. See docs/T9Sim_Hole_Provenance.md finding B"
  decay_d7:
    value: 0.40
    route: specified
    source: "docs/T9Sim_Specification_v2.md:200 and docs/T9Sim_DGP_Node_Register.md:145. G3 = 0.40 x G2, a revenue-recognition curve judgement"
  decay_d30:
    value: 0.70
    route: specified
    source: "docs/T9Sim_Specification_v2.md:588 and docs/T9Sim_DGP_Node_Register.md:146. G4 = 0.70 x G2, same judgement"

# The funnel base rates are SOLVER OUTPUTS, so the provenance is the target and the
# solver, never the number. v2 re-solves all three. Each `start` below is where the
# bisection begins, not an answer and not a bound.
funnel:
  # TWO changes on 16 August 2026, both to the same three keys.
  #
  # 1. `ceiling` renamed to `start`. It was never a ceiling. The law is a plain
  #    MULTIPLIER on the archetype propensity, clipped to [0, 1] only afterwards
  #    (auctions.py:370-377), and v1's own solved base_ir is 2.564963, well above
  #    any bound a reader would infer from the old name. v1's comment said
  #    "ceiling" and v2 inherited the word without the check.
  #
  # 2. The values are now v1's SOLVED answers rather than v1's initial guesses.
  #    0.08 / 0.40 / 0.55 carried no design authority: they were where v1's autocal
  #    happened to begin, and demonstrably poor, since base_ctr's true answer is
  #    0.27141, more than 3x the guess. Starting the search near the answer costs
  #    nothing and saves generation passes. The earlier objection to seeding from a
  #    solved value does not apply here, because there is no design meaning in
  #    0.08 to preserve.
  #
  # These remain SOLVER OUTPUTS. v2 re-solves all three at stage 2 against the
  # bands in validation.yaml and writes the answers to calibrated.yaml; matching
  # v1 is not required and not expected, since v2 has changed laws these targets
  # depend on. Record the bisection step count and |start - solved| so a solve
  # that barely moves is visible as such rather than mistaken for agreement.
  base_ctr:
    start: {value: 0.27141, route: auto-calibrated, source: "v1's solved answer, t9_sim/calibration/provenance_table.md:3 and calibrated.yaml, SOLVED by autocal 2026-06-18 against a population CTR target of 2-5 percent (AppsFlyer/Adjust). v1's pre-solve guess was 0.08, benchmarks.yaml:19"}
    target: "validation.yaml calibration_targets.population_ctr"
  base_ir:
    start: {value: 2.564963, route: auto-calibrated, source: "v1's solved answer, provenance_table.md:4, SOLVED by autocal 2026-06-18 against a click-to-install target of 25-40 percent (AppsFlyer). Above 1 because it multiplies a propensity below 1; the clip to [0, 1] is applied after. v1's pre-solve guess was 0.40"}
    target: "validation.yaml calibration_targets.click_to_install"
  base_payer:
    start: {value: 0.257853, route: auto-calibrated, source: "v1's solved answer, provenance_table.md:5, SOLVED by autocal 2026-06-18 so install-to-payer lands 2-5 percent (DeltaDNA 4 percent NA). v1's pre-solve guess was 0.55"}
    target: "validation.yaml calibration_targets.install_to_payer"

# ---------------------------------------------------------------------------
# Added 15 August 2026, closing the undeclared-key gap the upgraded hole
# detector found. These are the law PARAMETERS of nodes that graph.yaml already
# declares. Without them the network knows LU2 is a Beta keyed by archetype and
# cannot draw it, so every one of these is a stage-2 blocker rather than a
# review item.
#
# Provenance is the same as the 25 gate-1 holes: the values are recorded in
# t9_sim/calibration/provenance_table.md rows 39-50 and in v1's archetypes.yaml,
# each already carrying its own route and source. Nothing here is invented.
# ---------------------------------------------------------------------------

# LU2, LU3, LU4. Beta(a, b) per archetype. The register calls these
# `archetypes.propensity.*`. inactive is not a separate mechanism: it is one
# cell of the same law, and LU4's near-zero pairs with LU5's fixed zero.
archetype_propensity:
  route: inferred
  source: "v1 archetypes.yaml propensity block; provenance_table.md row 44-46. Each pair is a Beta(a,b) whose mean is the stated rate"
  click:            # LU2
    whale:           {value: [5, 5],   route: inferred, source: "~0.50; whales click selectively, convert hard"}
    engaged_spender: {value: [5, 5],   route: inferred, source: "~0.50"}
    casual:          {value: [4, 6],   route: inferred, source: "~0.40"}
    time_filler:     {value: [3, 7],   route: inferred, source: "~0.30; taps a lot, converts little"}
    inactive:        {value: [1, 19],  route: inferred, source: "~0.05; ad-blind"}
  install:          # LU3
    whale:           {value: [6, 4],   route: inferred, source: "~0.60"}
    engaged_spender: {value: [5, 5],   route: inferred, source: "~0.50"}
    casual:          {value: [3, 7],   route: inferred, source: "~0.30"}
    time_filler:     {value: [1, 9],   route: inferred, source: "~0.10"}
    inactive:        {value: [1, 49],  route: inferred, source: "~0.02"}
  payer:            # LU4
    whale:           {value: [9, 1],   route: inferred, source: "~0.90; near-certain payers"}
    engaged_spender: {value: [6, 4],   route: inferred, source: "~0.60"}
    casual:          {value: [1, 19],  route: inferred, source: "~0.05"}
    time_filler:     {value: [1, 49],  route: inferred, source: "~0.02"}
    inactive:        {value: [1, 199], route: inferred, source: "~0.005"}

# LU5. LogNormal(mu, sigma) per archetype, relative to casual = 1.0 by
# construction. The dollar anchor lives in ltv.base_median_usd, never here, so
# it is not counted twice. inactive is a FIXED ZERO, an exact identity rather
# than a small number, tied to LU4's near-zero payer rate.
archetype_ltv_multiplier:
  # mu and sigma are separate leaves because they have DIFFERENT provenance.
  #
  # THE 3 FREE mu WERE RELABELLED `auto-calibrated` to `inferred` on 16 August 2026.
  # The old label claimed a solver had produced them. None had. They are v1's design
  # judgements, checked against the whale-share target rather than solved against it,
  # and they CANNOT be solved as they stand: whale, engaged_spender, time_filler and
  # ltv.lognormal_sigma all aim at the same scalar, the top-5-percent share, so four
  # unknowns face one equation. sigma is the one the solver takes, and these three
  # are held.
  #
  # This is the mirror of the sigma correction made the same day. sigma was a real
  # solver output wearing a `specified` label; these were judgements wearing an
  # `auto-calibrated` one. Both directions of mislabelling were inherited from v1.
  #
  # Solving all four would need a per-archetype revenue-share target, and no source
  # in docs/Industry_Source_Reports.md splits spend by player archetype, which is
  # unsurprising: archetype is T9's own latent, not an industry category.
  whale:
    mu:    {value: 1.95, route: inferred, source: "~7x the casual median. Set against the whale top-5% revenue share target 0.55-0.65, NOT solved against it: see the block note. provenance_table.md row 47"}
    sigma: {value: 0.50, route: inferred, source: "within-whale spread, a judgement. The widest in the pool, so it drives the extreme spend tail. provenance_table.md row 48"}
  engaged_spender:
    mu:    {value: 0.92, route: inferred, source: "~2.5x. Set against the same whale-share target, not solved against it"}
    sigma: {value: 0.40, route: inferred, source: "spread judgement"}
  casual:
    mu:    {value: 0.00, route: quoted, source: "the reference archetype, unit median by construction, so this is an identity rather than an estimate"}
    sigma: {value: 0.30, route: inferred, source: "spread judgement"}
  time_filler:
    mu:    {value: -1.20, route: inferred, source: "~0.3x. Set against the same whale-share target, not solved against it"}
    sigma: {value: 0.30, route: inferred, source: "spread judgement"}
  inactive:
    fixed: {value: 0, route: specified, source: "exact zero identity, not a small draw. Tied to LU4's near-zero payer rate. Register row 10 and constraint R9"}

# LU6. One Dirichlet(k x centroid) draw per user, stored as 4 genre columns.
archetype_interest:
  concentration_k: {value: 20.0, route: inferred, source: "tightness around the centroid; sensitivity-test. provenance_table.md row 49"}
  order: [casual, strategy, rpg, hypercasual]
  centroids:
    whale:           {value: [0.10, 0.40, 0.40, 0.10], route: inferred, source: "whales skew strategy and rpg, the high-LTV genres"}
    engaged_spender: {value: [0.20, 0.30, 0.30, 0.20], route: inferred, source: "broad but core-leaning"}
    casual:          {value: [0.40, 0.15, 0.15, 0.30], route: inferred, source: "casual and hypercasual leaning"}
    time_filler:     {value: [0.35, 0.10, 0.10, 0.45], route: inferred, source: "session-filler genres"}
    inactive:        {value: [0.25, 0.25, 0.25, 0.25], route: inferred, source: "uniform, no engagement signal"}

