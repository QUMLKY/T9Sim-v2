entity_latents_extra:
  sigma_cre:  {value: 0.25, route: inferred, source: "LC1 creative-appeal spread. provenance_table.md row 40"}
  sigma_game: {value: 0.35, route: inferred, source: "LC2 monetisation-quality spread, drives the LTV tails. provenance_table.md row 41"}

# LA2, the app's audience profile: Dirichlet(k x centroid[app_category]) per app,
# stored as 5 archetype columns. NB v1 held 2 different concentrations, 10.0 at
# entity_latents.audience_dirichlet_k and 3.0 at bn.k_audience, and the register
# names both. The BN-layer value is the live one; the other was inert.
app_audience:
  concentration_k: {value: 3.0, route: inferred, source: "v1 bn.k_audience, the live BN-layer value. The older entity_latents.audience_dirichlet_k of 10.0 was marked INERT until the BN layer and is not carried"}
  order: [whale, engaged_spender, casual, time_filler, inactive]
  centroids:
    casual:      {value: [0.02, 0.09, 0.22, 0.40, 0.27], route: inferred, source: "v1 bn.audience_centroids"}
    strategy:    {value: [0.05, 0.15, 0.25, 0.33, 0.22], route: inferred, source: "v1 bn.audience_centroids"}
    rpg:         {value: [0.06, 0.18, 0.25, 0.31, 0.20], route: inferred, source: "v1 bn.audience_centroids"}
    hypercasual: {value: [0.01, 0.04, 0.15, 0.45, 0.35], route: inferred, source: "v1 bn.audience_centroids"}

# m_stage, the relevance weight per funnel stage: alpha = (1-w) + w * r_genre.
funnel_relevance_weights:
  click:   {value: 0.5, route: inferred, source: "relevance moves CTR about 2x between r=0 and r=1; review after the golden run"}
  install: {value: 0.6, route: inferred, source: "interest matters more once attention is paid"}
  pay:     {value: 0.7, route: inferred, source: "spend is the most interest-driven stage"}

# E2 and F2, the 2 delay laws. Structural only under the current no-window design.
funnel_delays:
  click_delay_mean_s: {value: 30, route: inferred, source: "E2 = D1 + Exponential(30s). provenance_table.md row 5"}
  install_delay:
    mu:    {value: 7.5, route: inferred, source: "median click to install about 30 minutes. provenance_table.md row 6"}
    sigma: {value: 1.0, route: inferred, source: "wide right tail in hours"}

# Per-auction context: the exchange (B3), the slot format (B6) and the slot
# quality lookup (v_slot). Missing from v2 until 16 August 2026, when the register
# review found B3, B6 and v_slot each naming a key that lived only in v1. The
# size-given-format table is NOT here: it is a conditional table and already sits
# at `tables.yaml size_given_format`.
context:
  ad_exchanges:                      # 2025 US mediation shares
    "AppLovin MAX":     {value: 0.52, route: quoted, source: "2025 mediation reports, MAX above 50 percent. t9_sim/config/benchmarks.yaml:161"}
    "Unity LevelPlay":  {value: 0.20, route: quoted, source: "2025 mediation reports. benchmarks.yaml:162"}
    "Google AdMob":     {value: 0.20, route: quoted, source: "2025 mediation reports. benchmarks.yaml:163"}
    "Mintegral":        {value: 0.05, route: inferred, source: "tail split judgement, no published figure. benchmarks.yaml:164"}
    "Liftoff Monetize": {value: 0.03, route: inferred, source: "tail split judgement, no published figure. benchmarks.yaml:165"}
  # No measured impression mix exists: Tenjin and CAS publish eCPM by format and
  # never impression shares. Triangulated as revenue share divided by eCPM, from
  # the Braberg 2025 revenue split (interstitial 50, rewarded 35, banner 15 percent
  # of ad revenue) against US eCPMs (banner about $0.5-1.2, interstitial $14-20,
  # rewarded $16-30), which implies banner 0.70-0.85 / interstitial 0.10-0.20 /
  # rewarded 0.05-0.10.
  slot_format_shares:
    banner:       {value: 0.70, route: inferred, source: "derived, revenue-share over eCPM triangulation, Braberg 2025 against Tenjin/CAS US eCPMs. Sensitivity range 0.55-0.85. benchmarks.yaml:176"}
    interstitial: {value: 0.20, route: inferred, source: "derived, see banner. benchmarks.yaml:177"}
    rewarded:     {value: 0.10, route: inferred, source: "derived, see banner; consistent with a 35 percent revenue share at roughly 20x banner eCPM. benchmarks.yaml:178"}
  # v_slot = format_weight(B6) x size_weight(B4, B5), landing in roughly [0.45, 2].
  # Attention proxies with no outside source of any kind, and none is available.
  slot_quality:
    format_weight:
      banner:       {value: 0.5, route: inferred, source: "attention proxy, consistent with the eCPM ordering. benchmarks.yaml:193"}
      interstitial: {value: 1.0, route: inferred, source: "the reference format, 1.0 by construction. benchmarks.yaml:194"}
      rewarded:     {value: 1.8, route: inferred, source: "opt-in attention premium. benchmarks.yaml:195"}
    size_weight:
      "320x50":  {value: 0.9, route: inferred, source: "small banner. benchmarks.yaml:197"}
      "300x250": {value: 1.1, route: inferred, source: "MREC, larger canvas. benchmarks.yaml:198"}
      "320x100": {value: 1.0, route: inferred, source: "the reference size. benchmarks.yaml:199"}
      "320x480": {value: 1.0, route: inferred, source: "full screen, the format weight already carries it. benchmarks.yaml:200"}
      "480x320": {value: 1.0, route: inferred, source: "full screen landscape, as 320x480"}

# D1 and D4, the 28-day window. O3 3e anchors the rival day index to its START.
time:
  window_days:      {value: 28, route: specified, source: "docs/T9Sim_Specification_v2.md 1.6 D1 and D4, the 4-week window"}
  window_start_utc: {value: "2025-06-02", route: specified, source: "v1 time.window_start_utc, a Monday so day-of-week 0 is Monday"}

# The target k_global is solved against. Not a generator draw: it is the pin the
# bisection aims at, so it belongs with the values it judges.
win_rate:
  target:           {value: 0.30, route: quoted, source: "iPinYou 23.8 percent empirical rescaled; the same target validation.yaml gates on"}
  solver_tolerance: {value: 0.005, route: inferred, source: "|achieved - target| accepted after the solve"}

# The 3 dependency constants the register named under v1's bn.* edge-flag names.
# The flags are gone (O11, no switched-off variants) but the constants are real.
dependency_strengths:
  pairing_strength:   {value: 1.0, route: inferred, source: "edge #1. v1 bn.pairing_strength_s. Seeds the IPF pairing table before the rake"}
  exposure_beta:      {value: 0.5, route: inferred, source: "edge #2. v1 bn.exposure_beta_vo. How strongly user value tilts campaign selection"}
  ios_ltv_multiplier: {value: 1.8, route: inferred, source: "edge #3. v1 bn.ios_ltv_multiplier. plat(iOS)=1.8, plat(Android)=1.0; externally bounded by AppMagic and Backlinko at about 1.6-2x"}
  payer_timing:
    route: inferred
    source: "edge #4. v1 bn.payer_timing. t_pay(hour, dow), raked to mean 1 over the population so install-to-payer is preserved. Shape from SOOMLA, IAP peaks at 4 PM and 8-9 PM, Saturday"
    hour_mult: [0.70, 0.60, 0.55, 0.50, 0.50, 0.60, 0.70, 0.80, 0.90, 1.00, 1.10, 1.15,
                1.20, 1.20, 1.30, 1.35, 1.40, 1.30, 1.20, 1.30, 1.40, 1.30, 1.00, 0.85]
    dow_mult:  [1.00, 1.00, 1.00, 1.00, 1.05, 1.30, 1.10]
