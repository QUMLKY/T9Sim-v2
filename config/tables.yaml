  size_given_format:
    kind: conditional
    parents: [B6]
    route: inferred
    source: "externally bounded. Banner from Adpiler 2023, 320x50 is 28.3 percent of all display impressions against 320x100 at 2.1 percent, about 10x. Interstitial menu from Google Ad Manager, phones are 320x480 portrait and 480x320 landscape (docs/Industry_Source_Reports.md:282-283); the orientation split itself is inferred. Rewarded is a full-screen unit with no slot-size concept per Unity LevelPlay. Values at docs/Archive/Simulator_Schema - June 10 (v7) full.md:458"
