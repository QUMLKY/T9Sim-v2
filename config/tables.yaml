    kind: conditional
    parents: [LU1]
    raked: {preserve: hour_marginal, method: ipf, tol: 1.0e-6}
    source: calibration/ipinyou_hourdow_distribution.csv
    base_hour_marginal:   # the iPinYou hour shape the rake must preserve
      {0: 0.077092, 1: 0.025543, 2: 0.014116, 3: 0.013783, 4: 0.007705, 5: 0.008069, 6: 0.009471, 7: 0.019186, 8: 0.028271, 9: 0.034150, 10: 0.052870, 11: 0.053109, 12: 0.053584, 13: 0.058726, 14: 0.054990, 15: 0.062192, 16: 0.062835, 17: 0.059677, 18: 0.063373, 19: 0.048545, 20: 0.048827, 21: 0.040811, 22: 0.058318, 23: 0.044758}
    # Circular tilt P(h|k), von Mises, raked so sum_k pi_k P(h|k) = the base hour
    # shape above. mu_k is the archetype's peak hour, kappa_k its concentration,
    # kappa = 0 meaning flat. Structure and rake rule at
    # docs/Archive/Simulator_Schema - June 10 (v7) full.md:663-666,691.
    archetype_tilts:
      route: inferred
      source: "externally shaped, values v1-only. Dayparting from ByteBrew, North America peak 8 PM with a 1 AM tail, and Flurry per-archetype hour shaping; SOOMLA puts the spend curve 2-3 hours later than the play curve (docs/Industry_Source_Reports.md sections 28, 29, 31). The 5 (mu, kappa) pairs themselves appear only at t9_sim/config/bn_cpts.yaml:30-45"
      mu_kappa:
        whale:           [22, 0.6]
        engaged_spender: [21, 0.5]
        casual:          [20, 0.3]
        time_filler:     [12, 0.4]
        inactive:        [0.0, 0.0]

  # pair_idx and c_idx are not stored tables. Both are built at run time by
  # IPF from other settings, so they carry a recipe rather than values.
  pair_idx_archetype_by_app:
    kind: joint_built_at_runtime
    parents: []
    raked: {preserve: [archetype_mix, uniform_app_popularity], method: ipf, iterations: 500}
    build_inputs: [LA2, pairing_strength]

  c_idx_campaign_given_valuebin:
    kind: conditional_built_at_runtime
    parents: [user_vbin]
    raked: {preserve: campaign_budget_shares, method: ipf, iterations: 300}
    build_inputs: [sample_weight, LC2, exposure_beta]

  # --- wired by O1, 15 August 2026 -------------------------------------------
  # Each is raked so the marginal the design already fixes survives, which is
  # what stops wiring from moving the population mix.
  #
  # Their tilt strengths are open item O3 3b, decided 15 August 2026: invent and
  # declare. No outside dataset can supply them, because archetype is T9's own
  # latent, so every value below is route `inferred` and the datasheet says so.
  #
  # The tilt is ONE dial per table, not a hand-written cell grid:
  #
  #     P(child = c | archetype a) = logistic( logit(p_marginal) + tau * s_a )
  #
  # s_a is the shared archetype ladder below. Two properties make this the form
  # to use. tau = 0 reproduces a parentless draw exactly, so O1 stays reversible
  # at run time and the sensitivity sweep has a true null. And because the ladder
  # is centred on the archetype shares, the pre-rake marginal already lands within
  # 0.6 percent of target, so the rake corrects rounding rather than undoing the
  # tilt. Cell values are built at load, never stored, so the dial cannot drift
  # from the grid it implies. The ladder itself is at meta.archetype_ladder.
  A3_os_given_archetype:
    kind: conditional_built_at_runtime
    parents: [LU1]
    raked: {preserve: os_marginal, target: {iOS: 0.59, Android: 0.41}, method: ipf, tol: 1.0e-6}
    tilt:
      level: iOS
      ladder: meta.archetype_ladder
      tau: {value: 0.13, route: inferred, source: "O3 3b, set so the top archetype reaches 0.68 iOS"}
      implies: {whale: 0.6772, engaged_spender: 0.6480, casual: 0.6176, time_filler: 0.5862, inactive: 0.5541}
      swing: 0.1231          # 1.22x relative, pre-rake marginal 0.5896 against target 0.59

  A5_device_given_archetype:
    kind: conditional_built_at_runtime
    parents: [LU1]
    raked: {preserve: device_marginal, target: {phone: 0.90, tablet: 0.10}, method: ipf, tol: 1.0e-6}
    tilt:
      level: tablet
      ladder: meta.archetype_ladder
      tau: {value: 0.13, route: inferred, source: "O3 3b, same strength as A3; tablet is the minority class so the same dial gives a smaller absolute swing"}
      implies: {whale: 0.1394, engaged_spender: 0.1244, casual: 0.1109, time_filler: 0.0986, inactive: 0.0876}
      swing: 0.0519          # 1.59x relative, pre-rake marginal 0.1006 against target 0.10

  D3_dow_given_archetype:
    kind: conditional_built_at_runtime
    parents: [LU1]
    raked: {preserve: dow_marginal, source: calibration/ipinyou_hourdow_distribution.csv, method: ipf, tol: 1.0e-6}
    tilt:
      level: weekend            # Sat and Sun together; the shift spreads evenly inside each block
      ladder: meta.archetype_ladder
      ladder_sign: +1        # CORRECTED 15 Aug 2026. Read in value order like A3 and A5. An earlier draft reversed it on the reasoning that regular players skew away from the weekend; both v1 and the v7 schema say the opposite, that high-value players skew slightly TOWARD it
      tau:
        value: 0.04
        route: inferred
        source: "O3 3b, corrected against v1 and the schema. The v7 schema states day-of-week PLAY is near-flat with a modest weekend uptick, and that the weekend SPEND skew is carried by t_pay rather than by a play-of-day tilt (docs/Archive/Simulator_Schema - June 10 (v7) full.md:691). tau = 0.04 reproduces v1's weekend_logit almost exactly: v1's per-archetype shifts fit tau = +0.0383 on this ladder, giving swing 0.035 against 0.033 here"
      implies: {whale: 0.3100, engaged_spender: 0.3014, casual: 0.2930, time_filler: 0.2847, inactive: 0.2766}
      swing: 0.0334          # 1.12x relative, pre-rake marginal 0.28578 against a uniform 0.28571. Deliberately the weakest of the 3 tilts, since day of week is near-flat by design

