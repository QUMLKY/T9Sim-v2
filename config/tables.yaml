# tables.yaml, the probability tables graph.yaml names.
# Values are NOT copied from v1's settings. Each table is populated from the
# design documents or recorded as a hole for gate 1.

meta:
  note: >
    9 tables. 6 carry over from v1 and 3 were wired by open item O1 on
    15 August 2026, os, device_type and day_of_week given archetype. The
    register rows for A3, A5 and D3 were amended to T2 with LU1 as parent
    before this file was written.

  # Shared input to the 3 tilted tables below. Not a table itself, so it lives
  # here rather than under `tables`, which holds only probability tables.
  archetype_ladder:
    route: inferred
    source: "O3 3b. Monetisation rank whale > engaged_spender > casual > time_filler > inactive, scored +2..-2, then centred on the archetype shares and scaled to unit variance under them"
    scores: {whale: 2.901, engaged_spender: 1.894, casual: 0.886, time_filler: -0.121, inactive: -1.128}
    check: {share_weighted_mean: 0.0, share_weighted_variance: 1.0}

  # The sweep the O3 3b decision commits to. Multiply every tau by each factor
  # in turn. x0 is the null and must reproduce the unwired generator bit for bit.
  tilt_sensitivity_sweep: [0.0, 0.5, 1.0, 2.0]

