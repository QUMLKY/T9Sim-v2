<text x="557" y="742" text-anchor="middle" font-size="11.0" font-weight="400" fill="#263238">flight mask</text>
<rect x="736" y="326" width="209" height="88" rx="9" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1.4"/>
<text x="841" y="350" text-anchor="middle" font-size="12.5" font-weight="600" fill="#263238">b_k</text>
<text x="841" y="366" text-anchor="middle" font-size="11.0" font-weight="400" fill="#263238">log b_k = log base_e</text>
<text x="841" y="382" text-anchor="middle" font-size="11.0" font-weight="400" fill="#263238">+ rho(w_k z + b_R R + pace)</text>
<text x="841" y="398" text-anchor="middle" font-size="11.0" font-weight="400" fill="#263238">+ sigma_k eps</text>
