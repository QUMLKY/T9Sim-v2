<svg xmlns="http://www.w3.org/2000/svg" width="620" height="215" viewBox="0 0 1240 430">
<rect width="1240" height="430" fill="#FFFFFF"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#78909C"/></marker></defs>
<text x="620.0" y="34.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#212121" text-anchor="middle">Two tiers, one bidding algorithm</text>
<text x="620.0" y="52.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#546E7A" text-anchor="middle">the same training runs under each view, only the visible data differs</text>
<rect x="50" y="150" width="240" height="120" rx="10" fill="#FAFAFA" stroke="#78909C" stroke-width="1.8"/>
<text x="62.0" y="174.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#212121">training split, view k</text>
<text x="62.0" y="194.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">the rows and columns this</text>
<text x="62.0" y="211.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">view is allowed to see,</text>
<text x="62.0" y="228.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">censoring applied</text>
<rect x="380" y="90" width="340" height="128" rx="10" fill="#FFCDD2" stroke="#D32F2F" stroke-width="1.8"/>
<text x="392.0" y="114.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#212121">Tier 1, the value of an impression</text>
<text x="392.0" y="134.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">four heads, E1) p(click), F1) p(install | click),</text>
<text x="392.0" y="151.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">G1) p(payer | install), G2) spend of a payer,</text>
<text x="392.0" y="168.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">multiplied into the value estimate EV</text>
<rect x="380" y="250" width="340" height="110" rx="10" fill="#FFE0B2" stroke="#EF6C00" stroke-width="1.8"/>
<text x="392.0" y="274.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#212121">Tier 2, the cost of winning</text>
<text x="392.0" y="294.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">one head, p(win at bid b), label H3) won,</text>
<text x="392.0" y="311.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">inputs every view feature, H2) the bid</text>
<text x="392.0" y="328.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">swept monotone, H1) the floor among them</text>
<rect x="810" y="128" width="380" height="168" rx="10" fill="#FAFAFA" stroke="#212121" stroke-width="1.8"/>
<text x="822.0" y="152.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#212121">profit_max, the bid rule</text>
<text x="822.0" y="172.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">sweep the ladder of 48 candidate prices,</text>
<text x="822.0" y="189.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">at each rung b score  (EV - b) x p(win at b),</text>
<text x="822.0" y="206.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">recommend the rung with the highest score,</text>
<text x="822.0" y="223.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">when no rung profits the chosen rung rarely wins</text>
<rect x="900" y="330" width="200" height="40" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/>
<text x="1000.0" y="355.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="middle">recommended bid</text>
<polyline points="290,180 335,180 335,154 380,154" fill="none" stroke="#78909C" stroke-width="2.2" marker-end="url(#ar)"/>
<polyline points="290,240 335,240 335,305 380,305" fill="none" stroke="#78909C" stroke-width="2.2" marker-end="url(#ar)"/>
<polyline points="720,154 765,154 765,190 810,190" fill="none" stroke="#78909C" stroke-width="2.2" marker-end="url(#ar)"/>
<polyline points="720,305 765,305 765,250 810,250" fill="none" stroke="#78909C" stroke-width="2.2" marker-end="url(#ar)"/>
<polyline points="1000,296 1000,330" fill="none" stroke="#78909C" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="50.0" y="410.0" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#546E7A">the composition is arithmetic, nothing after the two tiers is learned</text>
</svg>